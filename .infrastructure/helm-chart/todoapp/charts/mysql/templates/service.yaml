# Headless service for stable DNS names of StatefulSet members:
# mysql-0.mysql.mysql.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: {{ .Chart.Name }}
  ports:
  - name: mysql
    port: 3306
