namespace: mysql

replicas: 2

image:
  repository: mysql
  tag: "8.0"

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: app_user
  MYSQL_PASSWORD: "1234"

database: app_db

pvc:
  storage: 2Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi

tolerations:
- key: app
  operator: Equal
  value: mysql
  effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: app
          operator: In
          values:
          - mysql
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - mysql
      topologyKey: kubernetes.io/hostname
